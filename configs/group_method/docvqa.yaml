model:
  backend: azure_openai
  optimizer: Qwen3.8-Flash-Next
  target: Qwen3.8-Flash-Next
  optimizer_backend: openai_chat
  target_backend: openai_chat
  reasoning_effort: medium
  rewrite_reasoning_effort: ''
  rewrite_max_completion_tokens: 64000
  codex_exec_path: codex
  codex_exec_sandbox: workspace-write
  codex_exec_profile: ''
  codex_exec_full_auto: false
  codex_exec_reasoning_effort: none
  codex_exec_use_sdk: auto
  codex_exec_network_access: false
  codex_exec_web_search: false
  codex_exec_approval_policy: never
  claude_code_exec_path: claude
  claude_code_exec_profile: ''
  claude_code_exec_use_sdk: auto
  claude_code_exec_effort: medium
  claude_code_exec_max_thinking_tokens: 16384
  codex_trace_to_optimizer: true
  azure_openai_endpoint: ''
  azure_openai_api_version: 2024-12-01-preview
  azure_openai_api_key: ''
  azure_openai_auth_mode: ''
  azure_openai_ad_scope: ''
  azure_openai_managed_identity_client_id: ''
  optimizer_azure_openai_endpoint: ''
  optimizer_azure_openai_api_version: 2024-12-01-preview
  optimizer_azure_openai_api_key: ''
  optimizer_azure_openai_auth_mode: ''
  optimizer_azure_openai_ad_scope: ''
  optimizer_azure_openai_managed_identity_client_id: ''
  target_azure_openai_endpoint: ''
  target_azure_openai_api_version: 2024-12-01-preview
  target_azure_openai_api_key: ''
  target_azure_openai_auth_mode: ''
  target_azure_openai_ad_scope: ''
  target_azure_openai_managed_identity_client_id: ''
train:
  num_epochs: 5
  train_size: 50
  batch_size: 10
  accumulation: 1
  seed: 42
  steps_per_epoch: 1
gradient:
  minibatch_size: 8
  merge_batch_size: 8
  analyst_workers: 16
  max_analyst_rounds: 3
  failure_only: false
optimizer:
  learning_rate: 4
  min_learning_rate: 2
  lr_scheduler: cosine
  lr_control_mode: fixed
  skill_update_mode: patch
  use_slow_update: true
  slow_update_samples: 20
  longitudinal_pair_policy: mixed
  use_meta_skill: true
evaluation:
  use_gate: true
  sel_env_num: 0
  test_env_num: 0
  eval_test: true
env:
  name: docvqa
  skill_init: skillopt/envs/docvqa/skills/initial.md
  split_mode: split_dir
  split_seed: 42
  split_dir: data/docvqa/splits
  data_path: ''
  split_output_dir: ''
  exec_timeout: 120
  out_root: ''
  max_turns: 1
  max_completion_tokens: 16384
  workers: 16
  image_detail: auto
  limit: 0
group_rollout:
  enabled: true
  rollouts_per_item: 8
  rollout_budget_per_step: 80
  min_valid_rollouts: 6
  max_extra_attempts_per_item: 4
  retry_timeout: 900
  sampling_strategy: coverage_then_mixed
  coverage_passes: 1
  mixed_replay_steps: 0
  ensure_contrast_candidate: false
  deduplicate_ordinary_reflect: true
  hypothesis_bank_enabled: true
  failure_hypothesis_bank_enabled: true
  record_slow_update_variants: true
  dual_memory_enabled: true
